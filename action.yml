name: AI DevOps Review
description: Professional AI code review, security analysis, quality scoring and Notion documentation powered by Groq.
author: João Pedro de Oliveira

inputs:
  notion-token:
    description: Notion integration token.
    required: false
    default: ""
  groq-api-key:
    description: Groq API key.
    required: true
  notion-data-source:
    description: Notion data source ID.
    required: false
    default: "d4190e15-cd71-4d55-8706-1ccfeb0227fd"
  groq-model:
    description: Groq model.
    required: false
    default: "openai/gpt-oss-20b"
  notion-enabled:
    description: Enable Notion synchronization.
    required: false
    default: "true"
  min-score:
    description: Minimum score required by the quality gate. Use 0 to disable.
    required: false
    default: "0"
  fail-on-high-risk:
    description: Fail the action when the AI identifies high risk.
    required: false
    default: "false"
  policy-file:
    description: Repository policy file.
    required: false
    default: ".ai-devops.yml"

outputs:
  quality:
    description: Overall quality score from 0 to 10.
    value: ${{ steps.ai-devops.outputs.quality }}
  security:
    description: Security score from 0 to 10.
    value: ${{ steps.ai-devops.outputs.security }}
  maintainability:
    description: Maintainability score from 0 to 10.
    value: ${{ steps.ai-devops.outputs.maintainability }}
  risk:
    description: Overall risk level.
    value: ${{ steps.ai-devops.outputs.risk }}
  confidence:
    description: Review confidence from 0 to 1.
    value: ${{ steps.ai-devops.outputs.confidence }}

runs:
  using: composite
  steps:
    - name: AI DevOps Review
      id: ai-devops
      shell: bash
      env:
        NOTION_TOKEN: ${{ inputs.notion-token }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        NOTION_DATA_SOURCE: ${{ inputs.notion-data-source }}
        GROQ_MODEL: ${{ inputs.groq-model }}
        NOTION_ENABLED: ${{ inputs.notion-enabled }}
        AI_DEVOPS_MIN_SCORE: ${{ inputs.min-score }}
        AI_DEVOPS_FAIL_ON_HIGH_RISK: ${{ inputs.fail-on-high-risk }}
        AI_DEVOPS_POLICY_FILE: ${{ inputs.policy-file }}

        COMMIT_SHA: ${{ github.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        COMMIT_DATE: ${{ github.event.head_commit.timestamp }}

        REPOSITORY: ${{ github.repository }}
        REPOSITORY_URL: https://github.com/${{ github.repository }}
        COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

        GITHUB_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

      run: |
        set -euo pipefail

        test -n "${GROQ_API_KEY}" || {
          echo "::error::GROQ_API_KEY não configurado"
          exit 1
        }

        if [ "${NOTION_ENABLED}" = "true" ]; then
          test -n "${NOTION_TOKEN}" || {
            echo "::error::NOTION_TOKEN não configurado enquanto Notion está habilitado"
            exit 1
          }
        fi

        python3 "${GITHUB_ACTION_PATH}/notion_sync.py"

branding:
  icon: shield
  color: purple
