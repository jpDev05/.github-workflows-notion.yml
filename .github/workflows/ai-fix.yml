name: AI DevOps AI Fix

on:
  workflow_dispatch:
    inputs:
      file:
        description: File containing the finding
        required: true
      problem:
        description: Evidence-backed problem description
        required: true
      evidence:
        description: Evidence from the review
        required: true
      suggestion:
        description: Suggested direction
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate fix proposal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIX_FILE: ${{ inputs.file }}
          FIX_PROBLEM: ${{ inputs.problem }}
          FIX_EVIDENCE: ${{ inputs.evidence }}
          FIX_SUGGESTION: ${{ inputs.suggestion }}
        run: python3 scripts/ai_fix_proposal.py
      - name: Validate patch
        run: git apply --check ai-fix.patch
      - name: Apply patch
        run: git apply --index ai-fix.patch
      - name: Run project tests when detectable
        continue-on-error: true
        run: python3 scripts/test_runner.py
      - name: Create fix branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai-fix/${{ github.run_id }}"
          git switch -c "$BRANCH"
          git config user.name "ai-devops[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply AI DevOps proposal"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "fix: AI DevOps proposal" --body-file ai-fix.md