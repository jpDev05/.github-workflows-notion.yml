name: AI DevOps Test Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install optional pytest
        run: python -m pip install pytest
      - name: Run detected tests
        env:
          GITHUB_WORKSPACE: ${{{ github.workspace }}
        run: python3 scripts/test_runner.py
